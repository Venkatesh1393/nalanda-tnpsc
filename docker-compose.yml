# Sprint 4 Step 68 — Production Readiness.
#
# Local/staging orchestration for all three apps against the real MongoDB
# Atlas cluster (backend/.env's MONGODB_URI) — there is no local `mongo`
# service here since this project has no local-database mode (see
# memory/docs: MongoDB Atlas is the only datastore, everywhere). Run with:
#
#   docker compose up --build
#
# `env_file` points at each app's real .env — none of those are baked into
# an image or committed (see each app's .gitignore/.dockerignore), so this
# file is the only thing that reads them at compose time.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # docker-compose overrides take precedence over env_file — pin
      # NODE_ENV here so `docker compose up` always runs the production
      # image the Dockerfile actually built, regardless of what a
      # developer's local backend/.env happens to say.
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173,http://localhost:5180
    ports:
      - '5000:5000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Placeholders — override with real values via `docker compose build
        # --build-arg` or a `.env` file next to this compose file (compose
        # auto-substitutes ${VAR} from it into `args:`). Vite bakes these
        # into the JS bundle at build time, so they cannot come from
        # `env_file` the way the backend's config does.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_APP_ENV: production
    ports:
      - '5173:80'
    restart: unless-stopped
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_APP_ENV: production
    ports:
      - '5180:80'
    restart: unless-stopped
    depends_on:
      - backend
