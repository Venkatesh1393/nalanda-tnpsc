<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a3fbf" />
    <meta
      name="description"
      content="Nalanda TNPSC — AI-powered TNPSC exam preparation platform for Tamil Nadu."
    />

    <!--
      PWA readiness (Sprint 4 Step 71) — `vite-plugin-pwa` (vite.config.ts)
      injects the `<link rel="manifest">` and service-worker registration
      script itself at build time; these are the tags it doesn't cover
      (iOS has no manifest icon/standalone support of its own, per Apple's
      long-standing non-standard meta tags).
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nalanda" />
    <title>Nalanda TNPSC</title>

    <!--
      Typography per docs/UI_Design_System.md §3: Inter for Latin-script UI/body
      text, Anek Tamil for Tamil-script text (weight-matched to Inter so mixed
      bilingual sentences read consistently). Loaded here rather than bundled,
      per standard Vite/Google Fonts practice.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Anek+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
