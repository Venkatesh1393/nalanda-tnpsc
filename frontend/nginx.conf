# Sprint 4 Step 68 — Production Readiness.
# Serves the Vite-built SPA — `try_files` falls back to index.html for any
# path that isn't a real static file, since React Router owns client-side
# routing (routes/app-routes.tsx) and every deep link (e.g. /app/dashboard
# on a hard refresh) must still resolve to the app shell, not an nginx 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed, content-addressed build assets (Vite's default `assets/`
    # output) are safe to cache forever — a new deploy ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must always be revalidated — it's what points
        # at the current hashed asset filenames.
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
