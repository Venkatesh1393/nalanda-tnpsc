# Sprint 4 Step 68 — Production Readiness. Extended Sprint 4 Step 71 —
# Production Frontend Deployment (pre-compressed assets, PWA/service-worker
# caching rules).
# Serves the Vite-built SPA — `try_files` falls back to index.html for any
# path that isn't a real static file, since React Router owns client-side
# routing (routes/app-routes.tsx) and every deep link (e.g. /app/dashboard
# on a hard refresh) must still resolve to the app shell, not an nginx 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `vite-plugin-compression2` (vite.config.ts) writes a `<file>.gz`
    # sibling for every JS/CSS/HTML/SVG/JSON asset above 1KB at build time.
    # `gzip_static` serves that pre-built file directly instead of
    # compressing on every request — official `nginx:alpine` ships this
    # module by default, no custom build needed. `gzip on` stays as the
    # fallback for anything not pre-compressed (e.g. the manifest).
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;

    # Hashed, content-addressed build assets (Vite's default `assets/`
    # output, plus Workbox's precache-manifest-hashed `workbox-*.js`) are
    # safe to cache forever — a new deploy ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/workbox-.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker script and web app manifest are NOT
    # content-hashed — they must always be revalidated so an app update
    # (new `sw.js` precache list) and any manifest/icon change actually
    # reach an already-installed PWA instead of being cached indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /icons/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must always be revalidated — it's what points
        # at the current hashed asset filenames.
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
