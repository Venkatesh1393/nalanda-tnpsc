# Sprint 4 Step 69 — Production Deployment.
#
# The single public-facing entry point for a one-host production deployment
# (docs/Architecture.md's "Load Balancer" node, at this project's current
# single-VM scale) — TLS termination + routes each subdomain to the right
# internal service by Docker Compose service name (see
# ../docker-compose.prod.yml). Distinct from frontend/nginx.conf and
# admin/nginx.conf, which each serve their own app's already-built static
# files *inside* their own container — this one never serves files itself,
# it only proxies.
#
# Replace every `nalanda-tnpsc.com` below with the real domain before use,
# and provision certificates first (see docs/Deployment.md §7.4 — Certbot).
# Contains no secrets — safe to commit.

# --- Rate limiting at the edge, ahead of the backend's own express-rate-limit
# (rateLimiter.middleware.ts) — defense in depth: a flood that never reaches
# Node at all instead of being rejected only after the app boots a request. ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# --- HTTP -> HTTPS redirect for all three hostnames ---
server {
    listen 80;
    server_name app.nalanda-tnpsc.com admin.nalanda-tnpsc.com api.nalanda-tnpsc.com;

    # Certbot's HTTP-01 challenge needs plain HTTP to keep working even
    # after HTTPS is enforced everywhere else below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Student Web App ---
server {
    listen 443 ssl;
    http2 on;
    server_name app.nalanda-tnpsc.com;

    ssl_certificate     /etc/letsencrypt/live/app.nalanda-tnpsc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nalanda-tnpsc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin Panel — kept on its own subdomain rather than a path prefix so
# it's never accidentally reachable via the student-facing domain, and so a
# future IP allowlist (a common admin-panel hardening step) can be scoped to
# just this server block without touching the other two. ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.nalanda-tnpsc.com;

    ssl_certificate     /etc/letsencrypt/live/admin.nalanda-tnpsc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nalanda-tnpsc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.nalanda-tnpsc.com;

    ssl_certificate     /etc/letsencrypt/live/api.nalanda-tnpsc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nalanda-tnpsc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Razorpay's webhook (routes/payments.routes.ts) needs the exact raw
    # request body preserved end to end for signature verification
    # (app.ts's `verify` hook) — nginx's default buffering doesn't alter the
    # body, but keep proxy_request_buffering on (the default) here rather
    # than "optimizing" it off; streaming the body through in chunks is
    # exactly the kind of change that could silently break that signature.
    client_max_body_size 20m; # matches upload.middleware.ts's largest limit (study materials)

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend's own health/readiness endpoints (§3 of
        # docs/Deployment.md) already work through this proxy at
        # /api/health[/ready] — no separate exemption needed.
    }
}
