# Sprint 4 Step 69 — Production Deployment. Shared TLS + security-header
# policy, included by every server block in ../gateway.conf so all three
# subdomains stay consistent — edit once, applies everywhere.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — lets the browser verify certificate revocation status
# without its own separate round trip.
ssl_stapling on;
ssl_stapling_verify on;

# helmet() (backend/src/app.ts) already sets these on API responses — set
# them here too so the same policy applies to the frontend/admin static
# responses this gateway also fronts, not just the API.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
